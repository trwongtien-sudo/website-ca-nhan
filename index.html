<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trái tim chạy</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #ffe6f0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            top: 45%;
            left: 0;
            font-size: 80px;
            animation: chay 5s linear infinite;
        }

        .chan {
            font-size: 45px;
            text-align: center;
            margin-top: -15px;
            animation: nhay 0.2s infinite alternate;
        }

        @keyframes chay {
            0% {
                left: -150px;
            }

            50% {
                left: 45%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes nhay {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-12px);
            }
        }
    </style>
</head>

<body>

    <div class="heart">
        ❤️
        <div class="chan">🦵 🦵</div>
    </div>

</body>
</html>
